name: Bug report
description: A skill gave a wrong result or did not install
labels: [bug]
body:
  - type: input
    id: skill
    attributes:
      label: Skill
      description: The name of the skill
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Agent and version
      placeholder: Claude Code 2.1, Cursor 1.7, Codex CLI
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Include the prompt you used and the output of the agent.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Repository context
      description: Language, test framework, CI system. Remove secrets.
